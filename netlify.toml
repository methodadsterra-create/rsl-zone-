[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every path (language-prefixed public routes, /admin/*, etc.)
# must be served index.html so React Router can take over client-side.
# Without this, refreshing on e.g. /en/news/article-slug or /admin/dashboard
# would 404 at the CDN level.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
