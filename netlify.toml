[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback: every path (language-prefixed public routes, /admin/*, etc.)
# must be served index.html so React Router can take over client-side.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

# Link previews (X, WhatsApp, Facebook...)
[[edge_functions]]
  path = "/en/news/*"
  function = "og-preview"

[[edge_functions]]
  path = "/ar/news/*"
  function = "og-preview"
