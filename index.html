<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta name="monetag" content="1c07ec4002f116d97a3955c09348402d">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Theme + language are applied to <html> BEFORE React mounts, to avoid a
      flash of the wrong theme/direction on first paint. This tiny inline
      script is the only thing allowed to run before the bundle loads.
    -->
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem('rslzone_theme');
          var theme = storedTheme === 'dark' ? 'dark' : 'light'; // light is always the default
          document.documentElement.setAttribute('data-theme', theme);

          var storedLang = localStorage.getItem('rslzone_lang');
          var supported = ['en', 'ar'];
          // Admin panel: always English. Public site: the language in the URL,
          // else the visitor's saved choice, else Arabic (the default).
          var path = location.pathname;
          var fromUrl = path.split('/')[1];
          var lang = path.indexOf('/admin') === 0 ? 'en'
            : supported.indexOf(fromUrl) !== -1 ? fromUrl
            : supported.indexOf(storedLang) !== -1 ? storedLang : 'ar';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <title>SPL Zone — Independent Saudi Pro League News</title>
    <meta name="description" content="SPL Zone is an independent fan-media publication covering Saudi Pro League news, transfers, matches and clubs. Not affiliated with the Saudi Pro League." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:site_name" content="SPL Zone" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&family=Cairo:wght@600;700;800&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
